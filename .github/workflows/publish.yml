name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The extracted JSON and generated Typst are committed, so this job needs only
# the Typst compiler — no Python, and never the source PDFs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: typst-community/setup-typst@v5

      - name: Compile the books
        run: |
          mkdir -p _site
          # Bundled fonts only, so the CI render matches the local one exactly.
          typst compile --ignore-system-fonts --root . \
            src/book.typ _site/lizardmen.pdf
          typst compile --ignore-system-fonts --root . \
            --format png --ppi 90 --pages 1 \
            src/book.typ '_site/cover-{p}.png'

      - name: Assemble the site
        run: cp site/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
