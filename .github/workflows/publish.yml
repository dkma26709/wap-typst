name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The extracted JSON, the generated Typst and the cover art are all committed, so
# this job needs only the Typst compiler — no Python, and never the source PDFs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: typst-community/setup-typst@v5

      - name: Compile every book in the manifest
        run: |
          mkdir -p _site
          count=0
          for slug in $(jq -r '.books[].slug' build/books.json); do
            echo "::group::$slug"
            # Bundled fonts only, so the CI render matches the local one exactly.
            typst compile --ignore-system-fonts --root . \
              "src/$slug.typ" "_site/$slug.pdf"
            # The cover keeps the source image's own extension.
            cover=$(jq -r --arg s "$slug" \
              '.books[] | select(.slug==$s) | .cover // empty' build/books.json)
            if [ -n "$cover" ] && [ -f "assets/$cover" ]; then
              cp "assets/$cover" "_site/$slug-cover.${cover##*.}"
            fi
            count=$((count + 1))
            echo "::endgroup::"
          done
          cp site/index.html _site/index.html
          echo "compiled $count books"
          du -sh _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
