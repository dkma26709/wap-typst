name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The extracted JSON, the generated Typst and the cover art are all committed, so
# this job needs only the Typst compiler — no Python, and never the source PDFs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: typst-community/setup-typst@v5

      - name: Compile everything on the render list
        run: |
          mkdir -p _site
          count=0
          # emit.py writes build/render.json from the extraction manifest and the
          # edition manifest together, so this loop covers both without needing
          # to know which is which.
          for id in $(jq -r '.[].id' build/render.json); do
            echo "::group::$id"
            # An id is the book's path under src/ - `lizardmen/3.0` - so the
            # published tree mirrors the source tree and needs its folders.
            mkdir -p "$(dirname "_site/$id.pdf")"
            # Bundled fonts only, so the CI render matches the local one exactly.
            typst compile --ignore-system-fonts --root . \
              "src/$id.typ" "_site/$id.pdf"
            # The cover keeps the source image's own extension. An edition shares
            # the cover of the book it derives from, and so lists none of its own.
            cover=$(jq -r --arg i "$id" \
              '.[] | select(.id==$i) | .cover // empty' build/render.json)
            if [ -n "$cover" ] && [ -f "assets/$cover" ]; then
              cp "assets/$cover" "_site/$id-cover.${cover##*.}"
            fi
            count=$((count + 1))
            echo "::endgroup::"
          done
          # One page per army, landing in the folder its PDFs are already in,
          # plus the overview and the editions' shelf. emit.py writes them under
          # site/ in the shape they publish in, so the tree is copied across
          # rather than one file. Only the HTML: style.css is read into each
          # page at build time and is not served.
          find site -name '*.html' | while IFS= read -r page; do
            target="_site/${page#site/}"
            mkdir -p "$(dirname "$target")"
            cp "$page" "$target"
          done
          echo "compiled $count books, $(find _site -name '*.html' | wc -l) pages"
          du -sh _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
