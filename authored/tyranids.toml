text = "May take adrenal glands +3 points/model"

[[chapters.entries]]
name = "GENESTEALER BROOD"
profile = [["Genestealer", "6", "5", "0", "4", "4", "1", "6", "3", "7", "14"]]
unit_size = "8-24"
troop_type = "Infantry (Tyranid)"
base_size = "25x25"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Ambushers, Skirmishers, Rending Claws, Natural Armour (6+)"
text = ["""The vanguard organism. Genestealers go before the hive fleet by years, seeding the cellars and sewers of doomed cities, and when the swarm descends at last it finds the gates already open."""]

[[chapters.entries.options]]
text = "May take toxin sacs +1 point/model"

[[chapters.entries.options]]
text = "May take adrenal glands +1 point/model"

[[chapters.entries]]
name = "LICTOR"
profile = [["Lictor", "6", "6", "0", "5", "4", "3", "7", "4", "8", "90"]]
unit_size = "1"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Ambushers, Skirmishers, Forest Strider, Natural Armour (5+)"
text = ["""A Lictor is the swarm's held breath — a chameleon-skinned assassin that stands motionless among the trees for days, tasting the air for the scent of wizards."""]

[[chapters.entries.notes]]
text = "A Lictor never takes Instinctive Behaviour tests — the vanguard organism hunts alone by design."

[[chapters.entries.rules]]
name = "CHAMELEONIC SCALES"
text = [
    """Enemy missile attacks targeting the Lictor suffer an additional -1 To Hit modifier. In addition, an enemy unit may not choose Stand and Shoot as a charge reaction against a Lictor charging in the same turn it arrived from Ambush.""",
]

[[chapters.entries.rules]]
name = "FEEDER TENDRILS"
text = [
    """The Lictor may re-roll failed To Hit rolls in challenges, and against enemy characters and Wizards.""",
]

[[chapters.entries]]
name = "RAVENERS"
profile = [["Ravener", "7", "4", "0", "4", "4", "3", "5", "3", "6", "40"]]
unit_size = "3-9"
troop_type = "Monstrous Beast (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Ambushers, Natural Armour (5+)"
text = ["""Serpentine burrowers that swim through soil as eels through water, raveners erupt beneath the prey's feet in a spray of earth and scything talons."""]

[[chapters.entries.options]]
text = "May take toxin sacs +3 points/model"

[[chapters.entries.options]]
text = "May take adrenal glands +3 points/model"

[[chapters.entries]]
name = "ZOANTHROPES"
profile = [["Zoanthrope", "4", "2", "3", "3", "4", "3", "3", "1", "9", "60"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Synapse, Magic Resistance (3), Natural Armour (5+)"
text = ["""Withered bodies beneath swollen skulls, zoanthropes drift above the ground on a cushion of will, drinking the Winds of Magic dry before the enemy's wizards can call on them."""]

[[chapters.entries.rules]]
name = "WARP BLAST"
text = [
    """Range 18", Strength 5, Armour Piercing (2).""",
]

[[chapters.entries.rules]]
name = "PSYCHIC DRAIN"
text = [
    """At the start of the enemy Magic phase, remove one power die from the enemy power pool for each Zoanthrope unit on the battlefield, to a maximum of two dice per phase.""",
]

[[chapters.entries]]
name = "BIOVORE"
profile = [["Biovore", "4", "2", "3", "4", "4", "3", "2", "2", "6", "70"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (5+)"
text = ["""The biovore waddles at the rear of the swarm, dorsal chambers heavy with living mines, and lobs its squirming children over the lines with a wet, satisfied grunt."""]

[[chapters.entries.rules]]
name = "SPORE MINE LAUNCHER"
text = [
    """The Biovore fires as a stone thrower (see Trajectory Weapons in the Warhammer rulebook) with a range of 12"-36", Strength 3, and Strength 6 with the Armour Piercing (1) and Multiple Wounds (D3) special rules at the centre of the template. On a Misfire, do not roll on the Misfire chart: the Biovore does not shoot this turn and suffers 1 Wound with no saves allowed.""",
]

[[chapters.entries]]
name = "TYRANT GUARD"
profile = [["Tyrant Guard", "6", "4", "0", "5", "6", "3", "3", "3", "7", "60"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (4+)"
text = ["""Blind, mute and absolutely devoted, Tyrant Guard exist to die in their master's place — walls of chitin that step into the path of arrow, bolt and cannonball without being asked."""]

[[chapters.entries.options]]
text = "May take toxin sacs +5 points/model"

[[chapters.entries.options]]
text = "May take adrenal glands +5 points/model"

[[chapters.entries.rules]]
name = "SHIELD OF THE HIVE MIND"
text = [
    """While a friendly Hive Tyrant or Neurotyrant is within 3" of the unit, each hit that model suffers from a shooting attack is, on a roll of 2+, resolved against the Tyrant Guard unit instead.""",
]

[[chapters.entries]]
name = "HIVE GUARD"
profile = [["Hive Guard", "4", "3", "4", "4", "5", "3", "2", "2", "6", "70"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
equipment = "Impaler cannon"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (4+)"
text = ["""The impaler cannon has no need to see its prey. Its ammunition hunts by warmth and hate, threading over walls and through smoke to find the marrow."""]

[[chapters.entries.rules]]
name = "IMPALER CANNON"
text = [
    """Range 24", Strength 5, Armour Piercing (2), Multiple Shots (2). The impaler cannon may target a unit that is out of sight, provided it is in range, at an additional -1 To Hit modifier.""",
]

[[chapters.entries]]
name = "VENOMTHROPES"
profile = [["Venomthrope", "5", "3", "0", "3", "4", "3", "3", "2", "6", "55"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Toxin sacs (see Broodline Upgrades), Natural Armour (6+)"
text = ["""Venomthropes drift with the swarm in a haze of their own spores — a walking fog-bank of poison through which the broods advance half-seen."""]

[[chapters.entries.rules]]
name = "SPORE CLOUD"
text = [
    """The Venomthropes, and friendly Tyranid units within 6" of them, count as being in soft cover against shooting attacks.""",
]

[[chapters.entries]]
name = "PYROVORE"
profile = [["Pyrovore", "4", "3", "0", "5", "5", "3", "2", "3", "5", "65"]]
unit_size = "1-3"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Natural Armour (4+)"
text = ["""A gut that walks. The pyrovore exists to burn what cannot be eaten and to eat what cannot be burned, and it has never been particular about the order."""]

[[chapters.entries.rules]]
name = "FLAME GUT"
text = [
    """The Pyrovore has a Breath Weapon, Strength 4, with the Flaming Attacks special rule.""",
]

[[chapters.entries.rules]]
name = "VOLATILE"
text = [
    """If the Pyrovore is slain in close combat, roll a D6. On a 4+, each enemy unit in base contact with it suffers D3 Strength 4 hits with the Flaming Attacks special rule.""",
]

[[chapters.entries]]
name = "BARBGAUNTS"
profile = [["Barbgaunt", "4", "2", "3", "4", "4", "1", "2", "1", "5", "9"]]
unit_size = "10-20"
troop_type = "Infantry (Tyranid)"
base_size = "25x25"
equipment = "Barb-launcher"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (5+)"
text = ["""The bio-cannon and its bearer are one organism twice enslaved — the parasite gun bonded to the gaunt, and both bonded to the Hive Mind. Its detonating barbs shred legs and shatter shins, and a column so struck stops marching."""]

[[chapters.entries.rules]]
name = "BARB-LAUNCHER"
text = [
    """Range 18", Strength 4. A unit that suffers one or more unsaved Wounds from barb-launchers is slowed by the detonating barbs: it suffers -2 Movement and may not march until the start of the firing player's next turn.""",
]

[[chapters.entries]]
name = "VON RYAN'S LEAPERS"
profile = [["Leaper", "7", "4", "0", "4", "4", "1", "5", "2", "6", "15"]]
unit_size = "5-15"
troop_type = "War Beast (Tyranid)"
base_size = "25x25"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Ambushers, Skirmishers, Swiftstride, Forest Strider, Natural Armour (5+)"
text = ["""Pack-hunters bred from lictor stock, the leapers range ahead of the swarm on coiled limbs and long balancing tails. The first sign of them is the rear rank of the column going quiet."""]

[[chapters.entries]]
name = "NEUROLICTOR"
profile = [["Neurolictor", "6", "5", "0", "4", "4", "3", "6", "3", "8", "70"]]
unit_size = "1"
troop_type = "Monstrous Infantry (Tyranid)"
base_size = "40x40"
special_rules = "Tyranid, Ambushers, Skirmishers, Forest Strider, Chameleonic Scales (see Lictor), Natural Armour (5+)"
text = ["""The neurolictor conceals not its body but the very idea of itself. Soldiers who march near it find orders slipping from memory and courage curdling for reasons none of them can name."""]

[[chapters.entries.notes]]
text = "A Neurolictor never takes Instinctive Behaviour tests."

[[chapters.entries.rules]]
name = "BRAIN-FOG AURA"
text = [
    """Enemy units within 8" of the Neurolictor suffer a -1 penalty to their Leadership. This penalty is not cumulative with that of other Neurolictors.""",
]

# ---------------------------------------------------------------------------

[[chapters]]
title = "RARE UNITS"

[[chapters.entries]]
name = "CARNIFEX"
profile = [["Carnifex", "6", "3", "0", "6", "6", "5", "2", "4", "6", "190"]]
unit_size = "1-3"
troop_type = "Monster (Tyranid)"
base_size = "50x50 or 50x75"
equipment = "Scything talons"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Natural Armour (3+), Stomp (D6+1), Impact Hits (D3)"
text = ["""A carnifex is not cunning. It is a battering ram that bleeds, grown to break shieldwalls, gates and city walls in that order, and it does all three the same way — by continuing to walk."""]

[[chapters.entries.options]]
text = "May replace scything talons with crushing claws (+1 Strength) +20 points"

[[chapters.entries.options]]
text = "May take bio-plasma (Breath Weapon, Strength 4, Armour Piercing (1)) +25 points"

[[chapters.entries.options]]
text = "May take broodline upgrades:"
sub = [
    "Regenerative tissues +30 points",
    "Toxin sacs +15 points",
    "Adrenal glands +10 points",
]

[[chapters.entries]]
name = "TRYGON"
profile = [["Trygon", "7", "5", "0", "6", "6", "6", "4", "6", "8", "250"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 100x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Subterranean Assault, Natural Armour (4+), Stomp (D3)"
text = ["""The trygon swims through the deep earth trailing a wake of crackling bio-lightning, and surfaces precisely where the prey had agreed among themselves that nothing could ever come."""]

[[chapters.entries.options]]
text = "May be upgraded to a Trygon Prime (Synapse) +40 points"

[[chapters.entries.options]]
text = "May be upgraded to a Mawloc (Terror from Below) +30 points"

[[chapters.entries.options]]
text = "May take broodline upgrades:"
sub = [
    "Regenerative tissues +35 points",
    "Toxin sacs +20 points",
    "Adrenal glands +15 points",
]

[[chapters.entries.rules]]
name = "SUBTERRANEAN ASSAULT"
text = [
    """The Trygon has the Ambushers special rule. However, instead of deploying like normal Ambushers, it can arrive anywhere on the battlefield. When it emerges, place a marker anywhere on the battlefield and roll 2D6 and the scatter dice. If you roll a hit on the scatter dice, the marker stays in place; if you roll an arrow, move the marker the number of inches indicated by the 2D6 in the direction shown by the arrow. If the marker is moved off the tabletop, the Trygon is lost; treat it as a casualty. Once the final position is established, place the Trygon so it touches the marker. If the marker is under a unit or impassable terrain, place the Trygon next to the closest edge of the unit or terrain. It may face in any direction.""",
]

[[chapters.entries.rules]]
name = "TERROR FROM BELOW"
text = [
    """A Mawloc has the Terror special rule. In addition, each enemy unit within 6" of the Mawloc when it emerges from Subterranean Assault must pass a Panic test or flee.""",
    """A Mawloc never stops hunting from below: at the start of any of your Remaining Moves sub-phases, if it is not engaged in close combat, it may burrow — remove it from the battlefield. It re-enters play at the start of the Remaining Moves sub-phase of your next turn, emerging as per Subterranean Assault.""",
]

[[chapters.entries]]
name = "TERVIGON"
profile = [["Tervigon", "6", "3", "0", "5", "6", "6", "2", "3", "9", "280"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
special_rules = "Tyranid, Synapse, Natural Armour (4+), Stomp (D6)"
text = ["""The broodmother's flanks ripple and split as she walks, spilling fresh termagants into the fight; to slay her is to hear a hundred birth-sacs fall silent at once."""]

[[chapters.entries.options]]
text = "May take broodline upgrades:"
sub = [
    "Regenerative tissues +35 points",
    "Toxin sacs +20 points",
    "Adrenal glands +15 points",
]

[[chapters.entries.rules]]
name = "BROOD PROGENITOR"
text = [
    """At the start of each friendly turn, the Tervigon may spawn: roll 2D6 and add that many Termagants to one friendly unit of Termagants within 12", which may thereby exceed its starting size. The new models are placed in the unit's rear rank(s), and any that cannot be placed are lost. If a double is rolled, the spawned models are still added, but the Tervigon is spent and may not spawn again this battle.""",
]

[[chapters.entries.rules]]
name = "SYNAPTIC BACKLASH"
text = [
    """When the Tervigon is removed as a casualty, each friendly unit of Termagants within 12" immediately suffers D6 Strength 3 hits.""",
]

[[chapters.entries]]
name = "EXOCRINE"
profile = [["Exocrine", "6", "3", "3", "6", "6", "5", "2", "3", "6", "240"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
equipment = "Bio-plasmic cannon"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (3+), Stomp (D3)"
text = ["""The exocrine is a cannon that grew a body. The symbiote-gun owns the beast's every stride, and halts it mid-step when the firing solution ripens."""]

[[chapters.entries.rules]]
name = "BIO-PLASMIC CANNON"
text = [
    """Range 24", Strength 6, Armour Piercing (2), Multiple Shots (3).""",
]

[[chapters.entries.rules]]
name = "SYMBIOTIC TARGETING"
text = [
    """The Exocrine gains +1 To Hit with its shooting attacks during any turn in which it did not move.""",
]

[[chapters.entries]]
name = "TYRANNOFEX"
profile = [["Tyrannofex", "6", "3", "3", "6", "7", "6", "1", "3", "6", "300"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
equipment = "Rupture cannon"
special_rules = "Tyranid, Instinctive Behaviour (Lurk), Natural Armour (3+), Stomp (D3)"
text = ["""The heaviest gun-beast of the swarm advances like a fortress under sail, and its rupture cannon speaks with a report that unhorses knights a field away."""]

[[chapters.entries.rules]]
name = "RUPTURE CANNON"
text = [
    """Range 36", Strength 8, Armour Piercing (3), Multiple Wounds (D3), Multiple Shots (2).""",
]

[[chapters.entries]]
name = "HARUSPEX"
profile = [["Haruspex", "6", "4", "0", "6", "6", "6", "3", "5", "6", "235"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Natural Armour (4+), Stomp (D6)"
text = ["""The haruspex is the swarm's appetite distilled: a grasping tongue, a gullet the size of a hay-wain, and precisely enough brain to keep both working."""]

[[chapters.entries.rules]]
name = "GRASPING TONGUE"
text = [
    """The Haruspex makes one additional close combat Attack each round, made at Initiative 10 with the Armour Piercing (2) special rule.""",
]

[[chapters.entries.rules]]
name = "FEED ON THE FALLEN"
text = [
    """At the end of each close combat phase in which the Haruspex caused one or more unsaved Wounds, roll a D6: on a 4+ it regains one Wound lost earlier in the battle.""",
]

[[chapters.entries]]
name = "TOXICRENE"
profile = [["Toxicrene", "6", "4", "0", "5", "6", "5", "3", "6", "6", "225"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Toxin sacs (see Broodline Upgrades), Natural Armour (4+), Stomp (D3)"
text = ["""Every surface of the toxicrene weeps venom. It fights from within a strangling garden of its own lashes, and the prey is drowning in its air before a single tentacle closes."""]

[[chapters.entries.rules]]
name = "CHOKING MIASMA"
text = [
    """Enemy models in base contact with the Toxicrene suffer a -1 To Hit penalty in close combat.""",
]

[[chapters.entries]]
name = "HARPY"
profile = [["Harpy", "6", "3", "3", "5", "5", "5", "3", "3", "6", "185"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
equipment = "Stranglethorn cannon"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Fly (8), Natural Armour (5+), Stomp (D3)"
text = ["""The harpy rides the night wind on wings the width of a chapel, shrieking as it comes — and the shriek is a mercy, for it means the stranglethorns have not yet fired."""]

[[chapters.entries.rules]]
name = "STRANGLETHORN CANNON"
text = [
    """Range 18", Strength 5, Armour Piercing (1), Multiple Shots (2).""",
]

[[chapters.entries]]
name = "HIVE CRONE"
profile = [["Hive Crone", "6", "4", "3", "5", "5", "5", "4", "4", "6", "210"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Fly (8), Natural Armour (5+), Stomp (D3)"
text = ["""Where the harpy harries the ground, the crone owns the sky — spitting gouts of burning bile, and harvesting whatever else presumes to fly."""]

[[chapters.entries.rules]]
name = "FIERY BILE"
text = [
    """The Hive Crone has a Breath Weapon, Strength 4, with the Flaming Attacks special rule.""",
]

[[chapters.entries.rules]]
name = "SKY-HUNTER"
text = [
    """The Hive Crone re-rolls failed To Hit rolls in close combat against models with the Fly special rule.""",
]

[[chapters.entries]]
name = "PSYCHOPHAGE"
profile = [["Psychophage", "6", "4", "0", "5", "6", "5", "2", "4", "6", "200"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x100 or 60x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Magic Resistance (3), Natural Armour (4+), Stomp (D6)"
text = ["""The psychophage devours warriors whole and vents what remains of them as a glittering, corrosive mist. It holds a marked preference for wizards, whose minds burn like tallow."""]

[[chapters.entries.rules]]
name = "PSYCHOPHAGIC HUNGER"
text = [
    """The Psychophage has +1 Attack while within 12" of one or more enemy Wizards. If it kills an enemy Wizard in close combat, it immediately regains D3 Wounds lost earlier in the battle.""",
]

[[chapters.entries]]
name = "NORN EMISSARY"
profile = [["Norn Emissary", "6", "5", "0", "6", "7", "6", "3", "5", "10", "310"]]
unit_size = "1"
troop_type = "Monster (Tyranid)"
base_size = "50x50 or 50x100"
special_rules = "Tyranid, Synapse, Magic Resistance (2), Natural Armour (3+), Stomp (D6)"
text = ["""When the Hive Mind requires a personal touch, it grows an emissary: a towering intelligence of muscle, chitin and borrowed brains, sent into the world to do exactly one thing and constitutionally incapable of being turned from it."""]

[[chapters.entries.options]]
text = "May be upgraded to a Norn Assimilator +10 points"

[[chapters.entries.rules]]
name = "SINGULAR PURPOSE"
text = [
    """After both armies have deployed, nominate one enemy unit. The Norn Emissary has the Hatred special rule against the nominated unit, and may re-roll failed charge distance rolls when charging it. If the nominated unit is destroyed, the Emissary's purpose is fulfilled: it gains +1 Attack for the rest of the battle.""",
]

[[chapters.entries.rules]]
name = "NORN ASSIMILATOR"
text = [
    """A Norn Assimilator loses the Magic Resistance (2) special rule, and gains toxin sacs (see Broodline Upgrades) and Biomass Assimilation: at the end of each close combat phase in which the Assimilator caused one or more unsaved Wounds, it regains 1 Wound lost earlier in the battle.""",
]

