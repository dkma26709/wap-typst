[[chapters]]
title = "SPECIAL CHARACTERS"

[[chapters.entries]]
name = "THE RED TERROR"
profile = [["The Red Terror", "7", "5", "0", "6", "6", "5", "6", "5", "7", "215"]]
troop_type = "Monster (Character, Tyranid)"
base_size = "50x100 or 100x100"
special_rules = "Tyranid, Instinctive Behaviour (Feed), Ambushers, Natural Armour (5+), Stomp (D3)"
text = ["""The deep tunnels have a legend, if hunger can be said to keep legends: a red thing in the dark that swallows knights whole — horse, harness and all — and is always, always still hungry."""]

[[chapters.entries.notes]]
text = "The Red Terror is a Hero choice. It may not select Biomorphs — it is a unique organism."

[[chapters.entries.rules]]
name = "SWALLOW WHOLE"
text = [
    """If the Red Terror directs all of its Attacks at a single enemy model with a Line of Sight value of 2 or less, and all of them hit, the victim is seized in its coils and gulped down: the target must immediately pass an Initiative test or be removed as a casualty regardless of its remaining Wounds, with no saves of any kind allowed. A model removed this way counts as having suffered a number of Wounds equal to its remaining Wounds for combat resolution, and the Red Terror immediately regains D3 Wounds lost earlier in the battle as it digests.""",
]

