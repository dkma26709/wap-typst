# Proposals for Orcs & Goblins 3.0.
#
# A [[proposal]] is a change described rather than made: it anchors on nothing,
# alters nothing, and is set out at the back of the book to be argued over. The
# keys are `id`, `title`, `status`, `summary`, `why`, `against`, `cost` and
# `examples`; all but `id` and `summary` are optional, and each is a body in the
# same block format as a change's `new` (see editions/house/lizardmen.toml).
#
# Orcs & Goblins has no House edition, so this edition forks the plain book and
# `check_editions.py --identical-body` runs against out/orcs-goblins.pdf.
#
# Once a proposal is agreed it is rewritten as [[change]] entries against a
# House edition and deleted from here.

book = "orcs-goblins"


[[proposal]]
id     = "big-uns-should-not-cost-a-warboss"
title  = "Big 'Uns should not cost a Warboss"
status = "under discussion"

summary = """
The Big 'Uns and Little Big 'Uns upgrades would be easier to reach than they are. Three restrictions currently stack on one two-point upgrade: it needs a Warboss in the army, the unit must be of his own sub-species, and taking it moves the unit out of Core. The direction is fewer of those three. Which of them goes, and how far, is what there is to argue about.
"""

why = """
One upgrade, rationed three separate ways. Each Warboss unlocks exactly one unit, and a Warboss costs 115 points before wargear, so how many units of Big 'Uns a list may field is decided by how many of its dearest characters it is willing to buy out of an allowance capped at 35% of the army. The unit must then match his sub-species, and once upgraded it stops counting as Core. Any one of the three would be enough to keep Big 'Uns uncommon; the three together make a two-point upgrade cost a Warboss.

The book keeps writing around it. Gorbad lets a list take a unit of Common Orc Big 'Uns and a unit of Common Orc Boar Boy Big 'Uns as Core instead of Special. Borgut lets one unit of Orc Big 'Uns be Core, and stands in it himself. Two special characters written to undo the same restriction is a fair sign that the restriction is tighter than the book wants it.

The Empire prices the same shape more loosely. Inner Circle Knights cost +2 points a model for +1 Strength and +1 Initiative, one unit for each character with the Master of Battle special rule, and they cannot be taken as Core. Same price, same one-unit-per-character shape, same loss of the Core slot. What differs is that the unlock is any character carrying a rule rather than a Lord in particular, and that there is no sub-species match to satisfy.
"""

against = """
The restrictions are the price. +1 Weapon Skill and Mighty Blow (1) for two points a model is efficient, and what keeps it from being an automatic purchase is that reaching it costs a Warboss. Loosen the unlock and the upgrade wants repricing, which is a larger change than it first looks.

It also removes a reason to field a Warboss. For some lists Big 'Uns are what the Warboss is bought for, and a list that no longer needs him for them may not take him at all.
"""

cost = """
One clause in each of two rules, and possibly the price. Big 'Uns and Little Big 'Uns are worded identically, so whatever is settled applies twice over. Gorbad's and Borgut's rules want re-reading afterwards, since both exist to grant an exception that may no longer be exceptional.

Nothing else in the book moves.
"""

examples = [
  """
**The three levers, cheapest first.** Widen the unlock, so that any Orc character opens a unit rather than a Warboss alone. This is the Empire's shape and the smallest change of the three. Drop the sub-species match, so a Warboss of one kind may raise Big 'Uns of another. Or let them stay Core, which is the largest change, and the one Gorbad and Borgut already hand out by name.
""",
  """
**What the restriction costs today.** A list that wants two units of Big 'Uns must buy two Warbosses to unlock them, which is 230 points of characters before a single piece of wargear, each unit must match its own boss's sub-species, and both then come out of the Special allowance rather than Core.
""",
]
