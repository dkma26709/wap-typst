# Proposals for Lizardmen 3.0.
#
# A [[proposal]] is a change described rather than made: it anchors on nothing,
# alters nothing, and is set out at the back of the book to be argued over. The
# keys are `id`, `title`, `status`, `summary`, `why`, `against`, `cost` and
# `examples`; all but `id` and `summary` are optional, and each is a body in the
# same block format as a change's `new` (see editions/house/lizardmen.toml).
#
# Once a proposal is agreed it is rewritten as [[change]] entries against the
# House edition and deleted from here.

book = "lizardmen"


[[proposal]]
id     = "kroxigor-in-the-skink-cohort"
title  = "Kroxigor return to the Skink Cohort"
status = "under discussion"

summary = """
A Skink Cohort could once again include Kroxigor, one for every eight Skinks, under the Spawn-kin rule of the earlier edition taken as written. The Kroxigor are the Special Units entry at its printed cost, with no profile, price or option of their own. They stand in the second rank behind the Skinks, fight over them, and are reached only through them.
"""

why = """
The 3.0 book has no combined unit of the two. Skirmish Screen, which lets a unit of Kroxigor walk through Skink Skirmishers, is the one place in the book where they are written into a single rule.

The rule that put them in one unit comes over whole, and it asks for nothing the book does not already have. The Kroxigor is the one printed under Special Units. The sentences that place it in the second rank and pull it forward when the front rank thins are the ones this book already uses for Tetto'eko's palanquin. Counting the unit's ranks as if the big bases were filled with Skinks is how the rulebook already seats a character on a larger base.
"""

against = """
It puts Special-grade models on the Core allowance. Sixty Skinks may carry seven Kroxigor, 509 points as a single Core choice, and Kroxigor taken this way stand outside the duplicate-choice limit on Kroxigor units. A Kroxigor in the second rank can be struck only through the Skink in front of it, and this rulebook lets Predatory Fighter breed extra attacks from supporting attacks.

The rulebook also takes every Leadership test on the highest value present in the unit, so a Cohort tests at 7 while a Kroxigor stands. The earlier text said nothing either way; one sentence would hold it at the Skinks' 5 if the table wants that.
"""

cost = """
One rule and one option line on the Skink Cohort entry, and two edits to the earlier text. Its "mixed unit" becomes "combined unit", because Mixed Unit is a named rule in this rulebook and comes with handlers. Its Stomp clause gains a clause, because a Stomp here may only target a unit consisting of models with a Line of Sight value of 1 or less, and a single Kroxigor would otherwise lift the whole Cohort beyond a Monstrous Creature's reach.

Nothing else in the book moves.
"""

examples = [
  """
**As the entry would read.** Beneath the Skink Cohort's special rules:

- **Spawn-kin:** Skink Cohorts may include one Kroxigor for every eight Skinks to form a combined unit. Kroxigor in the unit use the Kroxigors entry from Special Units in every respect, at its printed cost. When a combined unit deploys or reforms, these Kroxigor must be placed in the unit's second rank, displacing Skink models as necessary to the back rank. When deploying or reforming a combined unit, the width of the unit's front rank cannot be less than that of its second rank. If no more Kroxigor can fit in the unit's second rank, place the remaining Kroxigor in subsequent ranks. If the unit's front rank is ever reduced so that its width is less than the width of the second rank, a Kroxigor must immediately move to the front rank (displacing rank and file models if necessary).

Whenever you are required to work out the combined unit's frontage or ranks (and therefore supporting attacks and rank bonus) count as if the footprint of the entire combined unit was filled with Skinks.

Unless otherwise stated, close combat attacks can only target Kroxigor within a combined unit if an enemy model is either in base contact with a Kroxigor, or if an enemy model is in base contact with a Skink who is in turn in base contact with a Kroxigor. For the purposes of Stomp the unit counts as consisting of Skinks, and Stomp hits are always resolved against the Skinks (if all the Skinks are slain, any excess hits are lost). Missile and Impact Hits against a Skink Cohort that contains one or more Kroxigor are randomised by rolling a D6; on a 1-4, the hit is resolved against a Skink, on a 5-6 it is resolved against a Kroxigor. Casualties are always taken from the rearmost rank of the appropriate model type.

And among its options:

- May include one Kroxigor for every eight Skinks in the unit +47 points/model
""",
  """
**At the table.** Twenty-four Skinks and three Kroxigor come to 213 points. The Kroxigor stand six Skinks wide in the second rank, so the front rank is six, and the eighteen Skinks behind them make three more. Counted as if the big bases were Skinks the unit is six ranks deep: full rank bonus, and Steadfast against all but the deepest blocks. Six Skinks strike from the front rank and nine Kroxigor attacks come over their heads, at Strength 7 in the first round and 6 after, each 6 To Hit breeding another under Predatory Fighter. Against that, every missile hit lands on a Kroxigor on a 5 or 6, and the whole Cohort takes the Kroxigor's penalty when it tries to restrain a pursuit.
""",
]


[[proposal]]
id     = "slann-battle-standard-magic-items"
title  = "The Slann keeps its full allowance when it carries the standard"
status = "under discussion"

summary = """
A Slann Mage-Priest carrying the Battle Standard would keep all 100 points of Magic Items and Disciplines of the Old Ones and take a magic standard besides, in the wording the rest of the corpus uses. The sentence halving that allowance to 50 would go. The permission for the Slann to remain Army General would stay.
"""

why = """
The corpus has one sentence for this, and 46 of its 51 Battle Standard clauses use it, across 29 books: the bearer "can have a Magic Standard with no points limit in addition to any other Magic Items they might have". Our own Ordo Draconis uses it twice.

Five entries instead make the banner cost the bearer its items, and the Slann is the only one of the five that gives up 50 points. The Bloodmaster, the Hatamoto, the Crypt Ghast and the Gunnery Wight each give up 25, in a sentence the four of them share word for word. The Slann is also the only wizard among them.

The same book puts the other wording in the very next entry: a Scar-Veteran carrying the standard keeps its 50 points and takes the banner on top. The restriction also turns on the standard being magical rather than on the office. A Slann carrying a plain battle standard keeps all 100, so the Totem of Prophecy, at 40 points, costs a Slann 90.

What makes it an outlier is the shape of the rule and not the size of the number. Everywhere else the Battle Standard adds a banner and leaves the bearer's own allowance where it found it: a Paladin keeps a Paladin's 50, a Necrarch Acolyte keeps an Acolyte's 50. Only in these five entries does the standard reach back and cut what the entry had already granted. That a Slann's grant is 100 is a fact about a 360-point Lord rather than a fact about the Battle Standard, and only the second of those is what this proposal touches.

Nor is the model cheap for what it does. At 360 points it is the dearest generic character in the corpus to arrive with Level 4 already on it, against the Liche Lord's 290 and the Grey Seer's 190, and it pays a further 25 to carry the standard at all. A model already paying at the top of its class is a poor place to collect a second, unstated charge.
"""

against = """
The rule would be uniform and the outcome would not. Every other Battle Standard option in the corpus carries 50 points of magic items or fewer, because the office falls to the Hero of a pair rather than the Lord beside him: the Paladin rather than the Bretonnian Lord, the Acolyte rather than the Necrarch Master, the Scar-Veteran rather than the Oldblood. The Slann is the only bearer anywhere whose own allowance is 100, so applying the common wording to it produces the best-equipped standard bearer in the game by double. Whether that is the rule working or a hole in it turns on whether you read the clause or the total.

It is also the only generic character permitted to be Army General while carrying the standard; the one other instance in the corpus is Walach, a special character, through a named banner. Army General, Battle Standard, a Level 4 wizard with +1 to cast and dispel, Inspiring Presence (6) and Hold Your Ground (12), all on one model. If the halving was ever the price of that concentration rather than an oversight, this removes the price and leaves the concentration standing.
"""

cost = """
One sentence in the Slann's Notes, of which only the middle clause goes. The first stays, so the banner is still unlimited, and the last stays, so the Slann may still be the Army General. What replaces the middle is the corpus's own wording, which puts the Slann's note in the same words as the Scar-Veteran's in the entry that follows.

Nothing else in the book moves.
"""

examples = [
  """
**As the note would read.** Battle Standard: The Battle Standard Bearer can have a Magic Standard with no points limit in addition to any other Magic Items they might have. A Slann carrying the Battle Standard may still be the Army General.
""",
  """
**What it buys.** A Slann that takes the Totem of Prophecy today has 50 points left, which covers Focus of Mystery and the Harrowing Scrutiny. Under this proposal it keeps 100: the Cupped Hands of the Old Ones at 45, Focus of Mystery at 30 and Becalming Cogitation at 25. The banner is the same in both cases, and no points limit stays a generous phrase for a shelf whose dearest entry is the Totem at 40, with the common standards stopping at 25.
""",
]


[[proposal]]
id     = "red-crested-skinks-without-tehenhauin"
title  = "Red Crested Skinks without the prophet"
status = "under discussion"

summary = """
A Skink Cohort could take the red crest without Tehenhauin in the army. The crest grants +1 Weapon Skill, Hatred (Skaven) and Immunity (Poisoned Attacks); the unit must take the Blessed Spawning of Sotek, which supplies the Devastating Charge the printed version bundles into the same upgrade; and it may replace its shields with great weapons. The total is the price the book already charges. Only Skink Cohorts are covered, not the five other units the printed rule reaches.
"""

why = """
The rule is written already, and priced. Tehenhauin's Prophet of Sotek makes Red Crested Skinks of Skink Cohorts, Skink Skirmishers, Raptadon Riders, Horned One Riders, Terradon Riders and Ripperdactyl Riders, gives them +1 Weapon Skill with Devastating Charge, Hatred (Skaven) and Immunity (Poisoned Attacks) for two points a model, and lets Cohorts swap shields for great weapons at two more. Nothing here is invented. What goes is the requirement to field a named character to reach any of it.

Requiring the Blessed Spawning of Sotek ties the crest to the god rather than to the man, and it does real work rather than standing as flavour. The Spawning is what grants Devastating Charge, so the crest itself no longer has to, and the Cohort pays the book's own rate of one point a model for a Spawning. One Spawning leaves the unit Core, which is what the Blessed Spawnings chapter allows.

The printed rule bars Red Crested Skinks from taking any Spawning at all, and that is the one clause here being reversed rather than lifted. The bar makes sense as printed, because the crest already carried Devastating Charge and Sotek's Spawning would only have duplicated it. Moving the grant to the Spawning removes the reason for the bar.
"""

against = """
Prophet of Sotek is a good part of what Tehenhauin is for. An army-wide rule is most of what a special character sells, and handing it to every list without him takes that away without giving him anything back.

The unit is cheap for what it does. Seven points buys a Weapon Skill 3 model striking at Strength 5 in the first round under Mighty Blow, in a Core block that may be sixty strong. Toughness 2 and a 6+ Natural Armour are all that hold it, but that many great weapon attacks will have settled most combats before the answer lands.
"""

cost = """
One rule and one option line on the Skink Cohort entry, and one clause of Tehenhauin's rule reversed for Cohorts. Prophet of Sotek stays exactly as printed for the five other units it covers, so a list that fields him loses nothing.

Nothing else in the book moves.
"""

examples = [
  """
**As the entry would read.** Beneath the Skink Cohort's special rules:

- **Red Crested Skinks:** A Skink Cohort may be upgraded to Red Crested Skinks. Red Crested Skinks have +1 Weapon Skill and the Hatred (Skaven) and Immunity (Poisoned Attacks) special rules. They must take the Blessed Spawning of Sotek and may take no other Blessed Spawning. In addition, they may replace their shields with great weapons.

And among its options:

- May be upgraded to Red Crested Skinks +1 point/model
- Must take the Blessed Spawning of Sotek +1 point/model
- May replace shields with great weapons +2 points/model
""",
  """
**At the table.** Thirty Red Crested Skinks with great weapons come to 210 points, which is seven a model: three for the Skink, one for the crest, one for Sotek's Spawning and two for the weapon. Crest and Spawning together come to the same two points Tehenhauin's version charges for the crest alone, and the weapon to the same two. They fight at Weapon Skill 3 and Strength 5 in the first round, Strength 4 after it, with Toughness 2 and a 6+ save to keep them standing.
""",
]


[[proposal]]
id     = "saurus-and-kroxigor-initiative-2"
title  = "Saurus Warriors and Kroxigors strike at Initiative 2"
status = "under discussion"

summary = """
Saurus Warriors and Kroxigors would move from Initiative 1 to Initiative 2. Nothing else on either profile changes. The reason is that neither is meant to be slow-witted; they are deliberate, and the book already says so everywhere except on these two entries.
"""

why = """
Both sit a step below every other model of their own kind. Every Saurus profile in the book except the Core warrior is Initiative 2 or better, and that includes the same Saurus when he is sitting on a Cold One or an Aggradon. A Saurus does not learn to move faster by being handed a mount.

The Kroxigor case is starker still, because the comparison is inside one creature type. A Kroxigor Ancient strikes at Initiative 2 and the Kroxigors he leads strike at 1, with nothing between them but age and a bigger stat line.
"""

against = """
Initiative 1 is doing real characterisation work elsewhere, and the principle behind this reaches a great deal further than two entries. Forty-three living profiles across the corpus sit at Initiative 1 or below, nine of them in this book, including the Slann Mage-Priest at 1 and Lord Kroak at 0.

So there are two different proposals hiding here. Raising every living creature off Initiative 1 is a sweep across thirty-two books that would also quicken trolls, giants and mammoths, which are slow on purpose. Raising these two is a judgement about Saurus and Kroxigor specifically. Both are defensible; they should not be argued as if they were one.
"""

cost = """
Two digits, and a glance at whether the pair are still priced correctly afterwards. The Kroxigors will feel it, since much of what they fight is also slow. The Saurus Warriors barely will, because most of what they meet already strikes at 3 or 4 and will continue to strike first.
"""

examples = [
  """
**The ladder as the book prints it.** Every Saurus and Kroxigor profile in the army, in the order the army list puts them:

|Model|Where|WS|I
|Saurus Oldblood|Characters|6|3
|Saurus Scar-Veteran|Characters|5|3
|Kroxigor Ancient|Characters|5|2
|Saurus Warrior|Core|3|1
|Temple Guard|Special|4|2
|Saurus on a Cold One|Special|4|2
|Kroxigor|Special|3|1
|Saurus on an Aggradon|Rare|4|2

Two rows in that table are Initiative 1, and they are the two the rank and file actually stand in.
""",
]


[[proposal]]
id     = "saurus-warriors-weapon-skill-4"
title  = "Saurus Warriors should be Weapon Skill 4"
status = "under discussion"

summary = """
Saurus Warriors would go from Weapon Skill 3 to Weapon Skill 4, at a point more per model. Every other Saurus in the book already fights at 4 or better, including the identical creature mounted on a Cold One.
"""

why = """
The book contradicts itself on one creature. A Saurus on foot in a Core unit is Weapon Skill 3; the same Saurus riding a Cold One in Special is 4, riding an Aggradon in Rare is 4, and standing in the Temple Guard is 4. Only the version a list actually builds around is worse at fighting, and nothing in the book explains what the mount teaches him.

The price is the easy part, because the corpus keeps quoting it. A point of Weapon Skill bundled with a second benefit costs two points a model in the Empire's Inner Circle Knights, in Orc Big 'Uns, in Goblin Little Big 'Uns and in this book's own Red Crested Skinks. On its own it is worth about one, which puts a Saurus Warrior at fourteen.
"""

against = """
The gap is what Temple Guard are sold on. At 17 points they currently buy a point of Weapon Skill, a point of Initiative, a polearm, Stubborn and the two Slann rules over a 13-point Saurus Warrior. Close the Weapon Skill and, if the Initiative proposal also passes, the Initiative, and four points is buying a polearm and Stubborn.

A Core block at Weapon Skill 4, Strength 4, Toughness 4, two Attacks, Predatory Fighter and a 5+ Natural Armour for fourteen points is also simply very good, and this army already has no trouble winning the fights it chooses.
"""

cost = """
One digit and one price. If the Initiative proposal is agreed as well then the two want pricing together rather than separately, because a fourteen-point Saurus Warrior at Weapon Skill 4 and Initiative 2 is a different unit from the one being amended twice.
"""

examples = [
  """
**What separates the two Saurus infantry entries.** As printed, and as this proposal would leave them:

|Entry|Points|WS|I|Also carries
|Saurus Warrior, as printed|13|3|1|Hand weapon
|Saurus Warrior, proposed|14|4|1|Hand weapon
|Temple Guard|17|4|2|Polearm, Stubborn, Slann rules

The four points would still buy a polearm, Stubborn and the two rules that tie the unit to a Slann, which is a fair sale. Whether it is a four-point sale is the argument.
""",
]


[[proposal]]
id     = "kroxigor-stupidity-away-from-skinks"
title  = "Kroxigor think better with Skinks about"
status = "under discussion"

summary = """
A Kroxigor would cost three points less, at 44, and be subject to Stupidity in any turn it starts with no friendly Skink unit within 6 inches. Standing near Skinks it behaves exactly as it does today.
"""

why = """
The book pairs the two everywhere except in the rules. Skink Skirmishers carry Skirmish Screen, written for no reason but to let Kroxigor walk through them, and those are the only two entries in the army that name each other at all.

The mechanism needs no inventing either, because the corpus has written it twice. The Snotlings' Mimic keys off a friendly Orc or Goblin unit within 6 inches, and our own Tyranids' Synapse penalises any unit that is not within 12 inches of the right friendly model.

What the discount buys is freedom of movement rather than a coin flip. The drawback is switched off by standing near a unit the list was always going to bring, so what it really costs is Kroxigor that must travel with their handlers instead of going where they please. The rulebook checks Stupidity only outside close combat, so it never bites once they arrive: this is entirely a rule about the approach.
"""

against = """
The discount is anchored on unconditional Stupidity, which is not what this is. The corpus prices Stupidity away at three points a model, on the Skaven Rat Ogre's Brain Transplant, and that model is Stupid wherever it stands. A version a competent player switches off by keeping Skinks within six inches is worth less than the full three, so 44 is the generous reading and 45 the cautious one.

It also collides with the Spawn-kin proposal at the front of this chapter. A Kroxigor standing inside a Skink Cohort is an inch from a Skink and would never test at all, taking the discount for nothing. That may be the intention, since it drives Kroxigor into the Cohort where the theme wants them, but the two cannot then be priced apart.
"""

cost = """
A points value and one clause on the Kroxigors entry, plus a decision about whether the Kroxigor Ancient shares it. Worth knowing before agreeing it: Cold-blooded will not help. Stupidity here is a flat D6 against a table rather than a Leadership test, and Immunity (Psychology) covers only Panic, Fear and Terror, so the army's usual answer to wobbling does nothing at all against this.
"""

examples = [
  """
**What the roll actually does,** in any turn no Skinks are close enough:

|D6|What happens
|1|Lurches D6 inches straight forward, may only Hold if charged, no combat reform
|2-3|Minus one to Weapon Skill, Ballistic Skill, Leadership and casting
|4-6|Nothing at all

Half the rolls do nothing, one in six is a real accident, and none of it is rolled at all while a Skink unit stands within six inches.
""",
]
