# The identity of this edition. Everything here is presentation — the rules
# changes themselves live in the per-book files beside this one.

slug  = "proposal"
label = "Proposals"

# The House rules are the text a proposal is argued against, so this edition is
# built on top of them rather than on the original. A proposal book therefore
# carries both changelogs: Our Changes, then Proposed Changes.
derives_from = "house"

# Bumped when a proposal is added, amended or withdrawn. Unlike the House
# edition's version, this one marks a round of discussion, not a round of play.
version = "2026.1"

blurb = "Rules we are arguing about, on top of the house rules. Nothing here has been played."

changelog_title = "PROPOSED CHANGES"

# Set as the closing pages of every book in the edition. The first line has to
# carry more weight here than the House edition's does: that one describes rules
# in force, this one describes rules that are not.
colophon = [
  "This is a PROPOSAL edition, and no part of it is in force. The rules text has been altered from the original in the places listed under Our Changes, which we play, and under Proposed Changes, which we do not — those are drafted here so they can be read in context and argued over. None of the alterations are marked in the body. Do not bring this book to a game expecting it to be the one being played.",
  "The underlying work is the Warhammer Armies Project, written and freely distributed by Mathias Eliasson. All rules text, army design and points values are his; the amendments and the proposals are ours alone, made for our own table, and carry no endorsement from him.",
  "Warhammer, Warhammer Fantasy Battle and all associated names, races and places are trademarks of Games Workshop Limited. This document is unofficial and unaffiliated, and no challenge to their status is intended.",
  "Typeset with Typst. Not for sale.",
]
