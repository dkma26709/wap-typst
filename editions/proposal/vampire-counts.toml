# Proposals for Vampire Counts 3.0.
#
# The book is the source of truth. Since the re-architecture, a proposal's text
# lives in src/vampire-counts-proposal.typ and nowhere else; this file records
# only what the proposal *is*, so the landing page can tally it. Copying the
# body here as well would put the same words in two places and let them drift,
# which is the failure mode the whole re-architecture was for.
#
# (editions/proposal/rulebook.toml still carries its full text. It was written
# while the books were generated from these files, and is now the older half of
# a pair - the rulebook's own PROPOSALS chapter is what ships.)
#
# Once a proposal is agreed it is rewritten as [[change]] entries against a
# House edition of this book and deleted from here.

book = "vampire-counts"


[[proposal]]
id     = "army-of-infamy-ordo-draconis"
title  = "An Army of Infamy: the Ordo Draconis"
status = "under discussion"

summary = """
The book's first Army of Infamy, and the first thing in this project with \
background prose of its own: an alternative composition for a vampire \
aristocracy that fights in its own person. Vargheists move to Core and Blood \
Knights to Special, and three new entries are added - Blood Guard, the mounted \
knight's own profile on foot; Blood Wyrms, a Rare wing of vampire knights on \
living drakes; and the Elder Wyrm, a single ridden Monstrous Creature \
answering the High Elf Drakemaster. \
The Blood Dragons carry the list: one unit of Blood Guard or Blood Knights may \
be taken as Core for each Blood Dragon character, and only one character who \
is not a Blood Dragon per Blood Dragon, which makes the Bloodline compulsory \
without banning anything. No unit may be Human, though characters may. All \
missile weapons come off the table, the mounts stop being Undead, and units \
with the Undead special rule stay available and cheap but stop counting \
towards the minimum an army must spend on Core. Two list rules carry the \
flavour: the Oath of the Keep, and Dread, not Slaughter. \
The Order chapter sets out who the lord is - a Bretonnian who declined the \
Grail path for the order that was actually holding the pass, sought out the \
Blood Dragons as a logistics decision, and holds a dozen scattered \
protectorates that pay in blood because blood, unlike grain and sons, comes \
back. Set out in full in the PROPOSALS chapter of \
src/vampire-counts-proposal.typ.
"""
