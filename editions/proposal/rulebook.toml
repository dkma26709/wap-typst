# Proposals for The Game of Fantasy Battles 3.11.
#
# A [[proposal]] is a change described rather than made: it anchors on nothing,
# alters nothing, and is set out at the back of the book to be argued over. The
# keys are `id`, `title`, `status`, `summary`, `why`, `cost` and `examples`; all
# but `id` and `summary` are optional, and each is a body in the same block
# format as a change's `new` (see editions/house/lizardmen.toml).
#
# Once a proposal is agreed it is rewritten as [[change]] entries against the
# House edition and deleted from here.

book = "rulebook"


[[proposal]]
id     = "armour-piercing-out-of-strength"
title  = "Take armour penetration out of Strength"
status = "under discussion"

summary = """
Strength would do one job: rolled against Toughness to wound, and nothing \
further. How well an attack defeats armour would become a separate value \
printed on the attack itself - **Armour Piercing** - carried by a weapon in its \
profile, or by a model for the claws and horns that carry no weapon. The chart \
that turns Strength into an armour save modifier would go.
"""

why = """
Every other characteristic answers one question. Weapon Skill decides whether \
you hit, Toughness whether you are hurt, Initiative who swings first. Strength \
answers two, and the second one nobody chose: it is separately read off a chart \
to strip armour.

That coupling costs us twice. It hands out armour penetration to things that \
were never designed to have it - a giant tears through plate as a by-product of \
being strong enough to wound - and it charges for it twice over anywhere a \
designer wanted it on purpose. A sling, whose whole identity is punching \
armour, has to buy Armour Piercing as a special rule to do what a crossbow gets \
free for being Strength 4.

It also wastes the top of its own scale. No save can ever be better than 2+, so \
every modifier past -5 does nothing at all, and the last three rows of the chart \
are decoration.

Splitting the two makes armour penetration a number somebody decided on and \
printed, and leaves Strength the same shape as the eight characteristics beside \
it.
"""

against = """
Strength doing two jobs is not an accident. It is the one lever that makes a big thing frightening without adding a stat to every profile in the game, and it is one number to learn rather than two. Splitting it buys clarity with paperwork, and the paperwork falls on thirty-one books.
"""

cost = """
This is the most invasive change available to the ruleset, and it cannot be \
applied by halves: until a book is converted, armour is a great deal better \
against everything in it. Thirty-one weapon profiles in this book, 257 more \
across the army books, and an Armour Piercing line on any model whose own \
attacks should defeat armour. The offensive spells would need values too - \
thirty-two of them cause hits at a Strength - or magic stops stripping armour \
altogether.
"""

examples = [
  """
**At the table, almost nothing moves.** A knight in heavy armour with a shield \
has a 3+ save. Shot by a handgun he saves on a 5+ today, because Strength 5 \
costs him two points; under this proposal he still saves on a 5+, because the \
handgun's profile would read AP 2. Every weapon would be given the value it \
effectively has now.

What moves is the part that was never stated. The same knight charged by a \
Strength 6 monster saves on a 6+ today, purely because the monster is big. \
Under this proposal the monster's profile has to say AP 3, or his armour holds.
""",
  """
**What gets clearer.** A sling is Strength 3 with Armour Piercing (1): a weapon \
that wounds badly and defeats armour. A crossbow is Strength 4 with nothing - \
and defeats armour exactly as well, for free, as a side effect of wounding \
better. Both would simply print AP 1, and the difference between them would be \
the one that was always meant to be the difference: the crossbow wounds better.
""",
]


[[proposal]]
id     = "monsters-carry-their-own-attacks"
title  = "Give every monster an attack of its own"
status = "under discussion"

summary = """
A monster's special attack would be printed in its own profile - a name, a \
number of hits, a Strength, and what it may be used against - rather than being \
a bracketed number on one rule shared across the whole game. **Stomp** would \
become one such attack among several instead of the only template there is, and \
a monster bred to hunt other monsters would carry an attack that says so. A \
monster with no printed attack would fight exactly as it does now.
"""

why = """
Across the thirty army books there are 144 entries whose troop type is Monster. \
Ninety-one of them have nothing whatever that shapes how they attack: a number \
of Attacks at a Strength, and that is the whole of it. What separates one from \
another is which of the numbers is larger.

The Chimera and the War Hydra make the point better than any argument. Both are \
Weapon Skill 4, Strength 5, Toughness 5, 5 Wounds. The Chimera has 6 Attacks and \
the rule Fly; the Hydra has 8 Attacks and no combat rule of its own at all. A \
three-headed thing that breathes fire and a winged horror with the heads of a \
lion, a goat and a dragon fight in precisely the same way, two attacks apart.

Two templates do exist, and both of them mean *trample*. Stomp is carried by \
nineteen monsters - every Giant, both Mammoths, the Colossi - and Impact Hits by \
twenty-eight. Nothing in the game is an attack aimed upward. Worse, Stomp is \
anti-everything-but-monsters by construction: used by a Monster it reaches any \
model with a Line of Sight value of 3 or less, which is infantry, cavalry, \
chariots, monstrous infantry, monstrous cavalry and monstrous creatures alike. \
The only thing a Stomp cannot touch is another Monster.

So the one bonus attack in the rules points downward, and there is no way to \
write a monster that points upward. That is a gap in the vocabulary, not a \
balance complaint.
"""

against = """
Stomp's virtue is that you learn it once and it works everywhere, and a hundred \
bespoke attacks is how a ruleset stops being memorable. There is also a cheaper \
answer to most of this: give the monsters that need one an existing rule they do \
not have - Killing Blow, Multiple Wounds, a Breath Weapon - and leave the \
vocabulary alone. That is worth trying on a handful of monsters before writing a \
new kind of profile for all of them.
"""

cost = """
Nothing already written breaks: Stomp stays exactly as it is for the tramplers, \
and a monster with no printed attack is unchanged. The work is per monster and \
there are 144 of them, so the sensible first cut is the ones whose role the book \
already names in its own artwork and fluff - the Carnosaur, the Hydra, the \
Chimera - rather than all of them at once.
"""

examples = [
  """
**The Carnosaur, which is the case that prompted this.** A Saurian apex \
predator, bred and ridden to hunt: Weapon Skill 4, Strength 6, Toughness 5, 5 \
Wounds, 4 Attacks, with Blood Frenzy, Cold-Blooded, Multiple Wounds (D3) and \
Natural Armour (4+). Nothing there is about hunting monsters. Multiple Wounds is \
a damage multiplier, not a target: it is wasted entirely against one-wound \
infantry, and it does nothing to make the Carnosaur better at closing with a \
Dragon than any other beast with four attacks. Its role lives in the artwork.

It would instead carry an attack of its own, the exact mirror of a Stomp:

## KILLING BITE

|Attacks|Strength|Special Rules
|1|As user|Always Strikes First, Multiple Wounds (D3)

> May only be directed at a model with a Line of Sight value of 4 or more - that \
is, at a Monster or at a ridden Monstrous Creature. Multiple Wounds would move \
out of the Carnosaur's own rules and into the bite, so that its four ordinary \
attacks stop being extra-lethal against everything that happens to have a second \
wound.

Where a Stomp reaches everything with a Line of Sight value of 3 or less, the \
bite reaches everything from 4 up. Between them they cover the board, and each \
monster carries whichever one it is actually for.
""",
  """
**What it does to the shape of the rules.** At present a monster's character is \
carried by its statline, and the statline can only say *how much*. A printed \
attack can say *what kind*, and the difference between monsters becomes a \
difference in kind rather than degree - the Giant tramples what is beneath it, \
the Carnosaur bites what is above it, and the Hydra would get the breath it is \
drawn with. None of that is expressible today except as a larger number in the \
Attacks column.
""",
]
