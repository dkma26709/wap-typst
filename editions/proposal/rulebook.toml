entry   = "TRAJECTORY WEAPONS"
op      = "replace"
why     = """
A trajectory weapon already prints two Strengths, one for the template and one \
for the model under its hole, so the AP column prints two to match: Strength 4 \
strips one point today, Strength 8 strips five, and those are the two numbers. \
The stray comma at the end of the special rules is an artefact of the original \
typesetting and goes with it.
"""

original = """12-48" 4(8) Cumbersome, Multiple Wounds (D3),"""

new = """
|Range|Strength|AP|Special Rules
|12-48"|4(8)|1(5)|Cumbersome, Multiple Wounds (D3)
"""


