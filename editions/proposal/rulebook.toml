id      = "ap-cannon"
title   = "Cannon - AP 5"
chapter = "WEAPONS & ARMOUR"
entry   = "CANNONS"
op      = "replace"
why     = """
Strength 10 strips seven points of armour today, four of them into a save that \
had already become impossible. Five is the whole of what there is to strip, so \
nothing at all is lost: a cannonball is stopped by no armour, before and after.
"""

original = """12-60" 10 Cumbersome, Multiple Wounds (D6/D3)"""

new = """
|Range|Strength|AP|Special Rules
|12-60"|10|5|Cumbersome, Multiple Wounds (D6/D3)
"""


