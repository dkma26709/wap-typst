# Proposals for The Game of Fantasy Battles 3.11.
#
# A [[proposal]] is a change described rather than made: it anchors on nothing,
# alters nothing, and is set out at the back of the book to be argued over. The
# keys are `id`, `title`, `status`, `summary`, `why`, `cost` and `examples`; all
# but `id` and `summary` are optional, and each is a body in the same block
# format as a change's `new` (see editions/house/lizardmen.toml).
#
# Once a proposal is agreed it is rewritten as [[change]] entries against the
# House edition and deleted from here.

book = "rulebook"


[[proposal]]
id     = "armour-piercing-out-of-strength"
title  = "Take armour penetration out of Strength"
status = "under discussion"

summary = """
Strength would do one job: rolled against Toughness to wound, and nothing \
further. How well an attack defeats armour would become a separate value \
printed on the attack itself - **Armour Piercing** - carried by a weapon in its \
profile, or by a model for the claws and horns that carry no weapon. The chart \
that turns Strength into an armour save modifier would go.
"""

why = """
Every other characteristic answers one question. Weapon Skill decides whether \
you hit, Toughness whether you are hurt, Initiative who swings first. Strength \
answers two, and the second one nobody chose: it is separately read off a chart \
to strip armour.

That coupling costs us twice. It hands out armour penetration to things that \
were never designed to have it - a giant tears through plate as a by-product of \
being strong enough to wound - and it charges for it twice over anywhere a \
designer wanted it on purpose. A sling, whose whole identity is punching \
armour, has to buy Armour Piercing as a special rule to do what a crossbow gets \
free for being Strength 4.

It also wastes the top of its own scale. No save can ever be better than 2+, so \
every modifier past -5 does nothing at all, and the last three rows of the chart \
are decoration.

Splitting the two makes armour penetration a number somebody decided on and \
printed, and leaves Strength the same shape as the eight characteristics beside \
it.
"""

against = """
Strength doing two jobs is not an accident. It is the one lever that makes a big thing frightening without adding a stat to every profile in the game, and it is one number to learn rather than two. Splitting it buys clarity with paperwork, and the paperwork falls on thirty-one books.
"""

cost = """
This is the most invasive change available to the ruleset, and it cannot be \
applied by halves: until a book is converted, armour is a great deal better \
against everything in it. Thirty-one weapon profiles in this book, 257 more \
across the army books, and an Armour Piercing line on any model whose own \
attacks should defeat armour. The offensive spells would need values too - \
thirty-two of them cause hits at a Strength - or magic stops stripping armour \
altogether.
"""

examples = [
  """
**At the table, almost nothing moves.** A knight in heavy armour with a shield \
has a 3+ save. Shot by a handgun he saves on a 5+ today, because Strength 5 \
costs him two points; under this proposal he still saves on a 5+, because the \
handgun's profile would read AP 2. Every weapon would be given the value it \
effectively has now.

What moves is the part that was never stated. The same knight charged by a \
Strength 6 monster saves on a 6+ today, purely because the monster is big. \
Under this proposal the monster's profile has to say AP 3, or his armour holds.
""",
  """
**What gets clearer.** A sling is Strength 3 with Armour Piercing (1): a weapon \
that wounds badly and defeats armour. A crossbow is Strength 4 with nothing - \
and defeats armour exactly as well, for free, as a side effect of wounding \
better. Both would simply print AP 1, and the difference between them would be \
the one that was always meant to be the difference: the crossbow wounds better.
""",
]


[[proposal]]
id     = "monsters-hunt-something-in-particular"
title  = "Give every monster something it is good against"
status = "under discussion"

summary = """
The blanket **Stomp (D6)** that every Monster receives from its troop type would \
go. In its place each monster would print a **quarry**: one class of target, and \
a bonus to the monster's *own* attacks against it - more Attacks against the \
small, or greater Strength against the large. These are attacks like any other. \
They roll To Hit, they can be saved, and there is something the other player can \
do about them.

A monster that is good at one thing and ordinary at everything else is not worth \
what one that is good at everything costs, so this is also the opening to cut \
some points, or move a monster out of Rare, or make it genuinely frightening in \
the one role it is given.
"""

why = """
A monster does not earn its Stomp; it is issued one. The Monsters troop type \
reads *Monsters are subject to the following special rules: Independent, Stomp \
(D6), Terror* - so all 144 Monster entries across the thirty army books have it, \
at the same value, whatever they are. Monstrous Creatures get Stomp (D3) the \
same way, and Chariots Impact Hits (D6).

Those D6 automatic hits are most monsters' real output, and they reach anything \
with a Line of Sight value of 3 or less: infantry, cavalry, chariots, monstrous \
infantry, monstrous cavalry and monstrous creatures alike. The one thing a Stomp \
cannot touch is another Monster. So every monster in the game is issued the same \
anti-everything attack, and none of them is issued anything for the thing it is \
actually drawn doing.

The Chimera and the War Hydra are both Weapon Skill 4, Strength 5, Toughness 5, \
5 Wounds - 6 attacks and 8 attacks - and both stomp D6. The Carnosaur and the \
Stegadon sit in the same book: one an apex predator bred and ridden to hunt, the \
other a walking fortress with a bolt thrower on its back. Both stomp D6. The \
Carnosaur's best work is done treading on militia, and the rules offer it nothing \
whatever against the only kind of target it cannot tread on.

Automatic hits are also the least interesting damage the game can hand out. No To \
Hit roll is made, so Weapon Skill never enters, and nothing that makes a model \
hard to hit does anything at all about them.

Eighty-four of the 144 monsters are Rare choices. A monster that is good at \
everything has to be priced and rationed as though it were; a monster with a \
quarry can be neither.
"""

against = """
Stomp is what lets one model fight a regiment at all. Four attacks against twenty \
men loses combat resolution every round of the game, and the stomps are what keep \
a monster in the fight long enough to matter - replace them with attacks that can \
miss and the numbers have to be generous or monsters quietly stop being taken.

One rule for every monster is also one rule to learn. A quarry means checking the \
target's troop type before every swing, on a model that already has the most \
special rules on the table.
"""

cost = """
The Monsters and Monstrous Creatures troop types in this book, and then a line on \
each of 144 monsters, none of which can be mechanical - the whole point is that \
each says something different. Points and army-list slots would want revisiting \
alongside. The sensible first cut is one book: Lizardmen carries both shapes of \
the idea, a hunter and a trampler, three pages apart.
"""

examples = [
  """
**The Carnosaur, which is the case that prompted this.** Weapon Skill 4, \
Strength 6, Toughness 5, 5 Wounds, 4 Attacks. Today it also stomps D6 automatic \
hits at Strength 6 into anything smaller than a Monster, and has nothing at all \
for anything larger.

## CARNOSAUR - QUARRY: THE LARGE

|Bonus to its own attacks|Against
|+1 Strength, +1 Attack|A model with a Line of Sight value of 3 or more

> Against a Stegadon it would swing five times at Strength 7, wounding on a 3+ \
rather than a 4+. Against a regiment of spearmen it would swing four times at \
Strength 6, and that would be all - no stomps, and no bonus. It becomes markedly \
worse at the job it was never meant to have. The numbers are the part to argue \
about: +2 Strength would wound a Stegadon on a 2+, which is probably a step too \
far.
""",
  """
**The Stegadon keeps what it is for.** A trampler's quarry points the other way, \
and the arithmetic can be made to land almost exactly where Stomp does now:

## STEGADON - QUARRY: THE SMALL

|Bonus to its own attacks|Against
|+2D6 Attacks|A model with a Line of Sight value of 1 or less

> Seven extra attacks on average, at Weapon Skill 3 against Weapon Skill 3 \
infantry, hit on a 4+ - three and a half hits, which is what Stomp (D6) delivers \
today. The trampler ends up where it started, but its damage now passes through \
a To Hit roll, so Weapon Skill finally means something on a monster, and every \
rule that makes a unit hard to hit starts working against the thing it most \
needed to work against.
""",
]
