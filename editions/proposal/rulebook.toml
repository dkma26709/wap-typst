# Proposals for The Game of Fantasy Battles 3.11.
#
# A [[proposal]] is a change described rather than made: it anchors on nothing,
# alters nothing, and is set out at the back of the book to be argued over. The
# keys are `id`, `title`, `status`, `summary`, `why`, `cost` and `examples`; all
# but `id` and `summary` are optional, and each is a body in the same block
# format as a change's `new` (see editions/house/lizardmen.toml).
#
# Once a proposal is agreed it is rewritten as [[change]] entries against the
# House edition and deleted from here.

book = "rulebook"


[[proposal]]
id     = "armour-piercing-out-of-strength"
title  = "Take armour penetration out of Strength"
status = "under discussion"

summary = """
Strength would do one job: rolled against Toughness to wound, and nothing \
further. How well an attack defeats armour would become a separate value \
printed on the attack itself - **Armour Piercing** - carried by a weapon in its \
profile, or by a model for the claws and horns that carry no weapon. The chart \
that turns Strength into an armour save modifier would go.
"""

why = """
Every other characteristic answers one question. Weapon Skill decides whether \
you hit, Toughness whether you are hurt, Initiative who swings first. Strength \
answers two, and the second one nobody chose: it is separately read off a chart \
to strip armour.

That coupling costs us twice. It hands out armour penetration to things that \
were never designed to have it - a giant tears through plate as a by-product of \
being strong enough to wound - and it charges for it twice over anywhere a \
designer wanted it on purpose. A sling, whose whole identity is punching \
armour, has to buy Armour Piercing as a special rule to do what a crossbow gets \
free for being Strength 4.

It also wastes the top of its own scale. No save can ever be better than 2+, so \
every modifier past -5 does nothing at all, and the last three rows of the chart \
are decoration.

Splitting the two makes armour penetration a number somebody decided on and \
printed, and leaves Strength the same shape as the eight characteristics beside \
it.
"""

against = """
Strength doing two jobs is not an accident. It is the one lever that makes a \
big thing frightening without adding a stat to every profile in the game, and \
it is one number to learn rather than two. Splitting it buys clarity with \
paperwork, and the paperwork falls on thirty-one books.
"""

cost = """
This is the most invasive change available to the ruleset, and it cannot be \
applied by halves: until a book is converted, armour is a great deal better \
against everything in it. Thirty-one weapon profiles in this book, 257 more \
across the army books, and an Armour Piercing line on any model whose own \
attacks should defeat armour. The offensive spells would need values too - \
thirty-two of them cause hits at a Strength - or magic stops stripping armour \
altogether.
"""

examples = [
  """
**At the table, almost nothing moves.** A knight in heavy armour with a shield \
has a 3+ save. Shot by a handgun he saves on a 5+ today, because Strength 5 \
costs him two points; under this proposal he still saves on a 5+, because the \
handgun's profile would read AP 2. Every weapon would be given the value it \
effectively has now.

What moves is the part that was never stated. The same knight charged by a \
Strength 6 monster saves on a 6+ today, purely because the monster is big. \
Under this proposal the monster's profile has to say AP 3, or his armour holds.
""",
  """
**What gets clearer.** A sling is Strength 3 with Armour Piercing (1): a weapon \
that wounds badly and defeats armour. A crossbow is Strength 4 with nothing - \
and defeats armour exactly as well, for free, as a side effect of wounding \
better. Both would simply print AP 1, and the difference between them would be \
the one that was always meant to be the difference: the crossbow wounds better.
""",
]

[[proposal]]
id     = "monsters-get-a-weapon-profile"
title  = "Give every monster a weapon profile"
status = "under discussion"

summary = """
Every monster would carry a weapon profile of its own, printed in its entry the \
way a great weapon or a bolt thrower is: how many attacks, at what Strength, and \
with what special rules. Most of them need nothing invented - the rules the game \
already has are enough to say what a monster is for, once there is somewhere to \
print them.
"""

why = """
Everything else that strikes a blow in this game has a profile for it. A spear \
prints its Strength, its special rules and when each applies; a mortar prints two \
Strengths, one for the template and one for the model under the hole. A monster \
prints a number in the Attacks column, and takes the same Stomp (D6) as every \
other monster from its troop type. Whatever separates a Carnosaur from a Stegadon \
has to be taken on trust from the artwork.

The Chimera and the War Hydra are both Weapon Skill 4, Strength 5, Toughness 5, \
5 Wounds - 6 attacks and 8 attacks - and neither has a combat rule of its own. \
One of them breathes fire in every picture ever drawn of it.

What makes this cheap is that the vocabulary already exists. **Multiple Wounds \
(D3)** is an anti-large rule and always has been: a model cannot suffer more \
wounds than it has on its profile, so the D3 is wasted entirely against one-wound \
infantry and doubles or trebles the damage against anything bigger. The Carnosaur \
already has it. What it lacks is a profile that says so, and somewhere to hang \
the touch of flavour that makes it a hunter rather than a big lizard - one point \
of To Hit against Monsters.

Eighty-four of the 144 monsters are Rare choices. A monster that is good at \
everything has to be priced and rationed as though it were. One whose profile \
says what it is for can be cheaper, or Special rather than Rare, or genuinely \
frightening in the single role it is given.
"""

against = """
If the rules a monster needs already exist, a profile only tidies them - the \
Carnosaur is already better against big targets than small ones, and printing a \
box around Multiple Wounds (D3) does not change a die roll anywhere. The honest \
answer is that the box is for the other 143: it is the place a designer has to \
look, and having to fill it in is what would stop a Hydra and a Chimera coming \
out identical.

And it is 144 boxes to fill, on the entries that already carry the most rules on \
the table.
"""

cost = """
A profile on each of 144 monsters, and the discipline not to make them \
mechanical. Points and army-list slots want revisiting alongside. The sensible \
first cut is one book: Lizardmen carries a hunter and a trampler three pages \
apart.
"""

examples = [
  """
**The Carnosaur, which is the case that prompted this.** Weapon Skill 4, \
Strength 6, 4 Attacks, Multiple Wounds (D3). Almost everything it needs is \
already there; none of it is anywhere a reader would look.

## CARNOSAUR: RENDING JAWS

|Attacks|Strength|Special Rules
|4|As user|Multiple Wounds (D3), +1 To Hit against Monsters

> Nothing here is new except the last clause. Multiple Wounds is doing the work \
it was always doing - wasted against a rank of spearmen, trebling the damage \
against a Stegadon - and the point of hunting Monsters specifically is worth one \
point of To Hit, which is flavour rather than arithmetic. What the profile really \
buys is the question it forces for every other monster: what goes in this box?
""",
]


[[proposal]]
id     = "stomps-come-from-the-size-gap"
title  = "Stomps should come from the size difference"
status = "under discussion"

summary = """
Stomp (D6) would stop being a flat die. A model would make **one Stomp for every \
2 full points by which its Line of Sight value exceeds its target's**. A Monster \
treading on infantry gets two; on cavalry or a monstrous creature, one; against \
another Monster, none at all.

Impact Hits would be left exactly as they are. They are momentum rather than \
mass, and they already work the way this proposal wants everything else to: the \
Chariots troop type gives Impact Hits (D6) as a default, and an entry prints its \
own number where it differs, as six chariots already do.

This is one of two answers to the same complaint. The other, which follows it, \
gives every monster its own printed Stomps instead of deriving them from \
anything.
"""

why = """
Line of Sight is already this game's ladder of size: 0 for a swarm, 1 for \
infantry, 2 for cavalry and chariots, 3 for monstrous cavalry and monstrous \
creatures, 4 for a ridden monstrous creature, 5 for a Monster. Stomp already \
leans on it - a Monster may Stomp anything with a value of 3 or less - so the \
scale is trusted to say *what* may be trodden on. It is simply not trusted to say \
*how much*.

The result is that a Dragon treads on a swarm exactly as hard as it treads on a \
monstrous creature, and both for D6. Making the number the size gap keeps the \
idea - big things trample smaller ones - and makes the trampling proportionate to \
the difference, which is what it was always meant to represent.

It also makes a monster something to be used well rather than merely pointed at \
a unit. Today every legal target takes the same D6; under this the number falls \
away as the target grows, so choosing what to charge becomes the whole of the \
skill of running a monster.
"""

against = """
It is a cut. Two stomps in place of D6 takes a monster's trampling of infantry \
from three and a half hits to two, and monsters are not obviously overpriced \
today. A die that always comes up 2 is also less fun to roll than a D6, which \
matters more than it sounds.

And there is a crack in it that the proposal after this one drives straight \
through. Impact Hits are exempted because a chariot is momentum rather than mass \
- but once one thing prints its number and another derives it, the question is \
why anything derives it at all. Sixteen monsters already print their own Stomps, \
for precisely the reason a chariot prints its Impact Hits: somebody had something \
specific to say about that model. A rule that has to make exceptions for the \
interesting cases is only doing the boring ones.
"""

cost = """
The Stomp special rule, and the Monsters and Monstrous Creatures troop types - \
three places, all of them in this book. Sixteen monsters across the army books \
print a Stomp of their own, most of them a number from 3D6 down to 1, and those \
would have to be reconciled or dropped. Nothing else in an army book need change, and no chariot \
is touched at all.
"""

examples = [
  """
**The whole rule, as a table.** Take the attacker's Line of Sight value, subtract \
the target's, and halve it.

|The gap in Line of Sight|Stomps
|1 or less|None
|2 or 3|1
|4 or 5|2

> A Monster (5) treading on infantry (1) makes 2. On cavalry, chariots or \
monstrous infantry (2), 1. On monstrous cavalry or a monstrous creature (3), 1. \
On a ridden monstrous creature (4), none - and none against another Monster, \
exactly as now. A monstrous creature (3) makes one against infantry and nothing \
against cavalry.
""",
  """
**What it does to a Carnosaur.** Today it stomps D6 into a regiment of spearmen, \
which is its best work and has nothing whatever to do with being a hunter. Under \
this it makes two. Against the Stegadon it was bred to fight it makes none, \
exactly as it does now - both are Monsters, and the gap between them is nil.

That last part is why the two proposals want taking together. A rule built on the \
size gap can only ever cut what a monster does to things beneath it; by \
construction it can give a monster nothing at all against its own kind. So \
whatever makes the Carnosaur a hunter has to come from its profile - Multiple \
Wounds against the many-wounded, a point of To Hit against Monsters - and never \
from trampling. The two halves do not overlap, which is exactly what makes them \
worth having at once.
""",
]


[[proposal]]
id     = "every-monster-prints-its-own-stomps"
title  = "Every monster prints its own Stomps"
status = "under discussion"

summary = """
The rival to the proposal above, and the opposite instinct. Rather than deriving \
the number from anything, each monster would simply print its own: how many \
Stomps it makes, and against what. A Stegadon might keep D6 against a Line of \
Sight value of 3 or less; a Carnosaur might make 2, and only against 2 or less. \
Where a monster wants more than one line, it gets more than one line.
"""

why = """
The size gap fixes the flat D6, but look at what it cannot fix. A Carnosaur and a \
Stegadon are both Monsters, so both have a Line of Sight value of 5, so a rule \
that reads nothing but the gap gives them **identical Stomps against every target \
on the table**. The Chimera and the War Hydra come out identical too, and for the \
same reason. The size gap makes trampling proportionate; it does not make one \
monster trample differently from another, because it never asks what the monster \
is - only how big.

Printing the number does ask. A walking fortress that fights by weight keeps the \
full D6 and keeps it against nearly everything; a predator that fights with its \
jaws makes a token two, and only against what it can knock down. The difference \
between them stops being a difference in their statlines and becomes a difference \
in how they fight, which is the whole complaint.

It also lets a monster be strange. Nothing in a derived rule can say *this one \
tramples infantry into paste and can barely tread on a horse*; a printed table \
says it in two lines.
"""

against = """
It is 144 numbers to invent with nothing to anchor them to, and no rule to fall \
back on when a case comes up that the author did not think of. Half of them will \
be written D6 against 3 or less out of habit, which is the present rule with more \
ink, and the ones that are not will drift apart across thirty books written over \
years - the same drift that left Slow to Fire named in eight places across the \
books and defined in none of them.

It is also the more expensive of the two by a wide margin. The size gap is three \
places in this book and sixteen printed values to reconcile; this one is an \
entry in each of 144 monsters across thirty books, and until a book is converted \
its monsters have no Stomps whatever.

And it is more to look up. One rule you learn once beats a table on every monster \
in the army.
"""

cost = """
The Stomp special rule and the Monsters and Monstrous Creatures troop types here, \
and then a line - sometimes two - on each of 144 monsters across the thirty army \
books. Unlike the size gap, this one cannot be done in the rulebook alone.

The two are not exclusive. The most likely settlement is both: the size gap as \
the default for any monster without a printed table, and a printed table wherever \
a monster has earned one. That costs the three rules now and the 144 entries only \
as and when somebody has something to say about a monster.
"""

examples = [
  """
**The two Lizardmen monsters, three pages apart.** One fights by weight and one \
by tooth, and the tables say so where no derived number could.

## STEGADON: TRAMPLING FEET

|Stomps|Against
|D6|A Line of Sight value of 3 or less

## CARNOSAUR: RAKING CLAWS

|Stomps|Against
|2|A Line of Sight value of 2 or less

> The Stegadon keeps precisely what every monster has today, because the walking \
fortress is the model the rule was written around. The Carnosaur keeps a token \
amount and loses it entirely against monstrous cavalry and monstrous creatures, \
so against anything of size it has to fight with its jaws - which, with Multiple \
Wounds (D3) on them, is exactly what it is for.
""",
  """
**More than one line, where a monster wants it.** A mammoth is not a Stegadon \
with bigger numbers; it is a thing that flattens men and shoulders horses aside, \
and those are two different effects rather than one effect at two sizes.

## WAR MAMMOTH: TRAMPLING

|Stomps|Against
|D6|A Line of Sight value of 1 or less
|D3|A Line of Sight value of 2 or 3

> Read the first line that applies. Nothing here needs a new rule, a new \
characteristic or a new roll - it is the Stomp the game already has, with its \
number and its reach moved out of the troop type and onto the monster.
""",
]

[[proposal]]
id     = "weapon-skill-split-into-attack-and-defence"
title  = "Split Weapon Skill into attack and defence"
status = "under discussion"

summary = """
Weapon Skill would become two characteristics: one for how well a model lands a blow, and one for how hard the model is to hit. The To Hit chart would cross the attacker's **Melee Attack** against the defender's **Melee Defence**, rather than crossing a single number with itself.
"""

why = """
One number is answering two questions, and they are not the same question. A halberdier drilled to hold a line and a duellist trained to kill are both Weapon Skill 3, and there is no way to say that one is hard to hit while the other is good at hitting. Every model in the game is exactly as good at defending itself as it is at attacking, because one digit does both jobs.

The book already describes the stat in both roles without remarking on it. Weapon Skill "defines how skilled a model is to fight in close combat", and a model at Weapon Skill 0 "is unable to attack with its normal attacks or defend itself in close combat". Two jobs, named in one sentence, carried by one number.

The seam shows wherever two profiles meet. When a Cavalry model is attacked the rules say to use the highest Weapon Skill of rider or mount, so a knight is defended by whichever of the two is better at swinging a weapon. With a defensive value printed, the model would simply have one.

This is the same argument as taking armour penetration out of Strength, and it deserves to be accepted or refused for the same reasons. A characteristic that answers two questions cannot be tuned for either of them.
"""

against = """
It is a new column on every profile in the game and a rewrite of the chart at the centre of the combat phase. Thirty-two books, and every statline in them.

The single stat is not only economy, it is a constraint that has kept close combat legible. One number, one comparison, and a player who knows their own Weapon Skill knows both halves of the fight. Splitting it doubles what has to be held in mind at the moment a player is already holding Strength, Toughness and Initiative.

And unlike the armour penetration split, there is nothing for the second value to be inherited from. That proposal can read most of its numbers off the chart it replaces, so almost nothing moves on the table. This one asks somebody to decide, for every profile in the game, which half of its Weapon Skill it keeps and what the other half becomes.
"""

cost = """
A second characteristic on every profile in thirty-two books, and a new To Hit chart to cross the two. Every rule that reads or alters Weapon Skill then has to say which of them it means: Melkoth's Mystifying Miasma reduces it, Big 'Uns and Red Crested Skinks add to it, and each of those becomes a choice rather than a copy.

The rules that reconcile two profiles want rewriting rather than adjusting. Cavalry take the highest Weapon Skill of rider and mount; war machine crews use their own. Both get simpler once a defensive number is printed, and both must be visited.
"""

examples = [
  """
**What the chart becomes.** Today it crosses Weapon Skill with Weapon Skill: equal numbers hit on 4+, an advantage hits on 3+, and more than double hits on 2+. Under this it crosses Melee Attack with Melee Defence and reads exactly the same way. What changes is that the two numbers are drawn from different columns of the profile, so a model may be good at one and poor at the other.
""",
  """
**Where it pays.** A Skink is Weapon Skill 2 and a Saurus Warrior Weapon Skill 3, and the difference is meant to be that the Saurus was spawned to fight and the Skink was not. Today that also makes the Skink easier to hit, which is not what anybody was describing. Give it a low Melee Attack and a respectable Melee Defence and it becomes the thing the artwork shows: quick, hard to pin down, and feeble when it does connect.
""",
]

[[proposal]]
id     = "combined-saves-for-rider-and-mount"
title  = "Rider and mount should not add their hides together"
status = "under discussion"

summary = """
The line letting a rider's and a mount's armour saves combine would become two rules. On Cavalry and Monstrous Cavalry the model would take the better of the two base saves and add equipment to it as normal. On a ridden monster the mount's Natural Armour would be the base, and the rider's own protection would carry over at half rate: one step of improvement for every two steps the rider would have on foot.
"""

why = """
The paragraph disagrees with itself in consecutive sentences. One says that when attacking a Cavalry model you always use the highest Weapon Skill, Toughness and Wounds of rider or mount. The next says that if both have armour saves, these may be combined. Three characteristics take the better of the two and the fourth adds them together, and nothing anywhere says why the save is different.

It also reaches the ceiling before the player has bought anything. A Saurus Oldblood has Natural Armour 5+ of his own and a Carnosaur has 4+, and combining those on the reading the armour table implies, where a 6+ is worth one step and a 4+ three, puts an Oldblood who has bought no equipment at all on a 2+ the moment he is mounted. That the book never works this example is half the complaint: it says the saves may be combined as normal and nowhere says what normal is when two save values meet. The light armour and the shield he may then purchase change nothing whatever, because no save can be better than 2+ and he is already there. A rule that makes defensive equipment worthless on precisely the models that can most afford it is not doing the job it was written for.

Half effect keeps the idea and loses the ceiling. A man in armour behind a scaled skull really is better protected than either alone, which is why taking the better of the two and discarding the rest reads badly. Carrying the rider across at half rate says the same thing without letting two hides finish the arithmetic on their own.
"""

against = """
It is a conversion table where there is currently one sentence, and it lands on the entries that already take longest to write down. Every monster-mounted character in the game would have a small sum to do at list-building time.

It is also a quiet reduction to every such character in thirty-two books at once, and those entries were priced with the stacked save in place. Taking the save down a step without revisiting the points takes value off models nobody complained about.
"""

cost = """
One sentence in the Cavalry troop-type rules replaced by two, and a six-row conversion table beside them. Monstrous Cavalry and Chariots read the same sentence, so they are covered by the first of the two rules and want checking rather than rewriting.

The points on monster-mounted characters want revisiting afterwards. The saving throw is most of what those models are paying for.
"""

examples = [
  """
**The conversion, for a ridden monster.** Work out what the rider's save would be on foot, count its steps, and give the mount one step of Natural Armour for every two, rounding down.

|Rider's save on foot|Steps
|No save|0
|6+|1
|5+|2
|4+|3
|3+|4
|2+|5

Every two rider steps improve the mount's Natural Armour by one. The result is capped at 2+, as any save is.
""",
  """
**What it changes.** A Saurus Oldblood on a Carnosaur saves on 2+ today, and still saves on 2+ if he buys nothing, because his own 5+ hide and the Carnosaur's 4+ reach the cap between them. Under this he starts on 3+, since his bare 5+ is two steps and half of that is one. Buying the light armour and the shield takes his foot save to 3+, which is four steps, worth two to the Carnosaur, and he arrives at 2+ having paid for it. Same ceiling, reached by spending rather than by mounting.
""",
]
