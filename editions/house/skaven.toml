# Amendments to Skaven 3.0.
#
# See editions/house/lizardmen.toml for the format.

book = "skaven"


[[change]]
id      = "skaven-slow-to-fire"
title   = "The Doomrocket gains Cumbersome"
chapter = "MAGIC ITEMS"
entry   = "ENCHANTED ITEMS"
op      = "replace"
why     = """
Slow to Fire is named in eight weapon profiles across the books and defined \nin none of them, so as written it asks the players to apply a rule that does \nnot exist. Cumbersome — a weapon that cannot be used to Stand and Shoot — is \nwhat it was reaching for, and the reference is corrected to the rule the \nrulebook actually carries.
"""

original = """12-36" 5 Slow to Fire"""

new = """
|Range|Strength|Special Rules
|12-36"|5|Cumbersome
"""
