# Amendments to The Empire 3.1.
#
# See editions/house/lizardmen.toml for the format.

book = "empire"


[[change]]
id      = "empire-slow-to-fire"
title   = "The Hochland Long Rifle gains Cumbersome"
chapter = "CHARACTERS"
entry   = "MASTER ENGINEER"
op      = "replace"
why     = """
Slow to Fire is named in eight weapon profiles across the books and defined \nin none of them, so as written it asks the players to apply a rule that does \nnot exist. Cumbersome — a weapon that cannot be used to Stand and Shoot — is \nwhat it was reaching for, and the reference is corrected to the rule the \nrulebook actually carries.
"""

original = """24" 4 Armour Piercing (1), Slow to Fire"""

new = """
|Range|Strength|Special Rules
|24"|4|Armour Piercing (1), Cumbersome
"""


[[change]]
id      = "full-plate"
title   = "Full Plate: heavy armour worn properly"
chapter = "CHARACTERS"
entry   = "CAPTAIN"
op      = "insert-after"
why     = """
The Empire's knightly orders and its state troops wear the same heavy armour in \
the list, and a Captain who has spent his career in a full harness is no better \
protected than a halberdier in a breastplate. Full Plate is the gap: a +1 to the \
armour save, on a model already in heavy armour, for twelve points.

Twelve rather than the six it was first written at. Six made it the obvious buy \
on every character who could take it, which is a tax rather than a decision; at \
twelve it competes with a magic item, which is where an armour upgrade belongs.
"""

original = """- May take a shield +5 points"""

new = """
FULL PLATE, an army special rule: models with heavy armour only. The model \
gains a +1 modifier to their armour save.

- May be upgraded with the Full Plate special rule for +12 points.
"""
