# Amendments to The Game of Fantasy Battles 3.11.
#
# See editions/house/lizardmen.toml for the format.

book = "rulebook"


[[change]]
id      = "spells-known-level-plus-one"
title   = "Wizards know one spell more than their level"
chapter = "MAGIC"
entry   = "WIZARDS & SPELLS"
op      = "replace"
why     = """
A Level 1 Wizard with a single spell is entirely predictable: the opponent knows \
what is coming, saves a dispel die for it, and the model spends the game as an \
expensive banner. One spell more gives every Wizard a choice to make in each \
Magic phase, and the lores can carry it — each has three spells at every level, \
so even a Level 1 Wizard picking two is choosing rather than taking what is left.
"""

original = """Each Wizard may choose a number of spells equal to their level."""

new = """
Each Wizard may choose a number of spells equal to their level plus one. Any \
Signature spell they know is in addition to these, as described below.
"""


[[change]]
id      = "armies-of-infamy"
title   = "Armies of Infamy"
chapter = "CHOOSING YOUR ARMY"
entry   = "THE ARMY GENERAL"
op      = "insert-before"
why     = """
A book that wants to offer a second composition of itself has nowhere to say so, \
and no words to say it in. Moving an entry between categories, withholding one, \
adding one, laying a rule over the whole army: the rules already understand every \
part of what such a list does, and what was missing was permission to do all of it \
at once. One clause could not have been written in an army book at all. The \
minimum an army must spend on Core is set here, so only here can a \
list change what counts towards it. Written for the Ordo Draconis, which is the \
first of them and has a book of its own.
"""

original = """An army must always include at least one character to be its Army General."""

new = """
## ARMIES OF INFAMY

Some books offer a second way of building a force from them, called an Army of Infamy.

An Army of Infamy is chosen in place of the book's ordinary list rather than \
alongside it. It may move entries from one category to another, refuse you entries \
the book otherwise allows, add entries of its own, and lay one or more rules over \
the whole army. It may also change which units count towards the minimum an army \
must spend on Core units. Everything in the book that the Army of Infamy does not \
change applies as it is written.

Both players should know which composition each army is using before deployment.
"""
