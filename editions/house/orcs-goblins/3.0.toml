[[change]]
id      = "black-orcs-strike-twice"
title   = "Black Orcs have two Attacks, at 14 points"
chapter = "SPECIAL UNITS"
entry   = "BLACK ORCS"
op      = "replace"
why     = """
The same argument as the Chaos Warrior next door, and for the same reason: an \
elite unit that strikes once is heavy infantry in name only, and Black Orcs are \
what the rest of an Orc army is arranged around. The second Attack is what \
makes them worth the points and worth the Special slot.
"""

original = """Black Orc 4 4 3 4 4 1 2 1 8 13"""

new = """
|M|WS|BS|S|T|W|I|A|Ld|Points
|4|4|3|4|4|1|2|2|8|14
"""
