# Amendments to Orcs & Goblins 3.0.
#
# See editions/house/lizardmen/3.0.toml for the format.

book = "orcs-goblins"


[[change]]
id      = "big-uns-are-their-own-entry"
title   = "Big 'Uns are a unit again, not an upgrade"
chapter = "CORE UNITS"
entry   = "ORC BOYZ"
op      = "replace"
why     = """
3.0 folds Big 'Uns into Orc Boyz as an upgrade: a Warboss lets one unit pay two \
points a model for +1 Weapon Skill and Mighty Blow, and that unit then counts as \
a Special choice. It reads cheaply and plays worse than it reads — the upgrade \
is bought on a unit already chosen, so the decision is made twice and neither \
time against the rest of the list.

The earlier line of the book gave Big 'Uns and Boar Boy Big 'Uns entries of \
their own, priced against the other Core units, and this restores that. Brutes \
stay beside them: the two were never alternatives, and cutting one to make room \
for the other is what 3.0 did rather than what it should have.

Whether a Warboss should be required at all is a separate question, and is not \
settled here.
"""

original = """It stood on both ORC BOYZ and ORC BOAR BOYZ:

For each Orc Warboss in your army, you may upgrade one unit of Orc Boys or Orc Boar Boyz of the same sub-species to Big 'Uns. Big 'Uns gain +1 Weapon Skill and the Mighty Blow (1) special rule. In addition, they count as Special Units.

For each Orc Warboss in your army, you may upgrade one unit of Orc Boys or Orc Boar Boyz of the same sub-species to Big 'Uns. Big 'Uns gain +1 Weapon Skill and the Mighty Blow (1) special rule. In addition, they count as Special Units."""

