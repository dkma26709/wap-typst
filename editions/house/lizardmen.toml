# Amendments to Lizardmen 3.0.
#
# See editions/house/rulebook.toml for the format. In `new`, `@LABEL: value`
# writes a profile field and two `|`-delimited lines write a weapon profile —
# headings, then values.

book = "lizardmen"


[[change]]
id      = "salamander-march-and-shoot"
title   = "Spout Flames gains March & Shoot"
chapter = "SPECIAL UNITS"
entry   = "SALAMANDER"
op      = "replace"
why     = """
A Skirmishing hunting pack whose one weapon cannot be used in a turn it marched \
spends most of a game out of position. The rule sits on the weapon rather than \
the unit, beside Slow to Fire, which is where every other book in the set puts \
it.
"""

original = """n/a 4 Flaming Attacks, Slow to Fire"""

new = """
|Range|Strength|Special Rules
|n/a|4|Flaming Attacks, March & Shoot, Slow to Fire
"""


[[change]]
id      = "razordon-march-and-shoot"
title   = "The Razordon's spines gain March & Shoot"
chapter = "SPECIAL UNITS"
entry   = "RAZORDON"
op      = "replace"
why     = """
The same reasoning as the Salamander it hunts beside: a Skirmishing pack whose \
weapon demands it stand still is a pack that never gets to skirmish.
"""

original = """18" 4 Armour Piercing (1), Rapid Fire"""

new = """
|Range|Strength|Special Rules
|18"|4|Armour Piercing (1), March & Shoot, Rapid Fire
"""
