# Amendments to Lizardmen 3.0.
#
# `original` is the anchor: the block's text, quoted from the book. Punctuation
# and case are folded before matching, so a hyphen typed here will find an en
# dash in the source, but the words must be exact. `until` extends the anchor
# across consecutive blocks. Ops: replace, insert-after, insert-before, delete.
#
# In `new`, a blank line starts a new block and its first character decides the
# kind: `- ` a list, `## ` a run-in heading, `@LABEL: value` a profile field, and
# two `|`-delimited lines a weapon profile — headings, then values.

book = "lizardmen"


[[change]]
id      = "salamander-spout-flames"
title   = "Spout Flames: Cumbersome, and fired on the march"
chapter = "SPECIAL UNITS"
entry   = "SALAMANDER"
op      = "replace"
why     = """
Two things at once, both on the one profile. Slow to Fire is named here and \
defined nowhere in any of the books, so it is corrected to Cumbersome — a weapon \
that cannot be used to Stand and Shoot — which is the rule it was reaching for. \
March & Shoot is ours: a Skirmishing hunting pack whose only weapon cannot be \
used in a turn it marched spends most of a game out of position. The two do not \
overlap; one governs the charge reaction, the other the shooting phase.
"""

original = """n/a 4 Flaming Attacks, Slow to Fire"""

new = """
|Range|Strength|Special Rules
|n/a|4|Cumbersome, Flaming Attacks, March & Shoot
"""


[[change]]
id      = "ancient-salamander-spout-flames"
title   = "The Ancient's Spout Flames, likewise"
chapter = "RARE UNITS"
entry   = "ANCIENT SALAMANDER"
op      = "replace"
why     = """
The same weapon on a larger beast, and it would be strange for the Ancient to be \
slower to bring its flames to bear than the Salamander it grew out of.
"""

original = """6" 5 Flaming Attacks, Slow to Fire"""

new = """
|Range|Strength|Special Rules
|6"|5|Cumbersome, Flaming Attacks, March & Shoot
"""


[[change]]
id      = "temple-guard-palanquin-equipment"
title   = "The Temple Guard Palanquin is armed"
chapter = "CHARACTER MOUNTS"
entry   = "TEMPLE GUARD PALANQUIN"
op      = "insert-after"
why     = """
The entry gives the bearers a Weapon Skill, a Strength and eight Attacks, and \
then never says what they are swinging. Most character mounts list no equipment \
because they are beasts fighting with what they were born with, but this one is \
four Temple Guard, and the books arm their counterparts: the Dwarfs' \
Shieldbearers, who likewise carry a character into battle, are given a hand \
weapon, as are the Anvil of Doom's crew, the Blood Throne's and the Halfling \
Ogre Bodyguard.
"""

original = """BASE SIZE: 50x75 or 60x90"""

new = """
@EQUIPMENT: Hand weapon
"""


[[change]]
id      = "razordon-spines"
title   = "The Razordon's spines gain March & Shoot"
chapter = "SPECIAL UNITS"
entry   = "RAZORDON"
op      = "replace"
why     = """
The same reasoning as the Salamander it hunts beside: a Skirmishing pack whose \
weapon demands it stand still is a pack that never gets to skirmish. Note that \
the Razordon's weapon does not carry Cumbersome, since Instinctive Defence \
requires it to Stand and Shoot when charged.
"""

original = """18" 4 Armour Piercing (1), Rapid Fire"""

new = """
|Range|Strength|Special Rules
|18"|4|Armour Piercing (1), March & Shoot, Rapid Fire
"""
